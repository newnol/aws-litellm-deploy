# =============================================================================
# LiteLLM Proxy - Docker Compose
# =============================================================================
# Runs LiteLLM Proxy with Nginx as reverse proxy.
# =============================================================================

version: "3.8"

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/litellm_config.yaml:ro
    command:
      - "--config"
      - "/app/litellm_config.yaml"
      - "--port"
      - "4000"
      - "--host"
      - "0.0.0.0"
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-litellm-master}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: litellm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      litellm:
        condition: service_healthy
