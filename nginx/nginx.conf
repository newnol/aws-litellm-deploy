# ============================================================
# Nginx Reverse Proxy for LiteLLM Proxy
# Ready for horizontal scaling (add more upstream servers)
# ============================================================

# Upstream - LiteLLM backend servers
# Add more servers here when scaling horizontally
upstream litellm_backend {
    # Current single instance
    server litellm:4000;
    
    # When scaling, add more:
    # server litellm-2:4000;
    # server litellm-3:4000;
    
    # Load balancing method (default: round-robin)
    # least_conn;  # Send to server with least connections
    # ip_hash;     # Sticky sessions by IP
}

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1000;

    # Health check endpoint (for load balancer)
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # LiteLLM API
    location / {
        # Rate limiting
        limit_req zone=api_limit burst=50 nodelay;

        # Proxy to LiteLLM
        proxy_pass http://litellm_backend;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (for streaming)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Access log
    access_log /var/log/nginx/litellm_access.log;
    error_log /var/log/nginx/litellm_error.log;
}
